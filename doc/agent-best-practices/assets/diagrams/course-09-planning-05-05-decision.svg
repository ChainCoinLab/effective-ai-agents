<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">09. 规划 Planning - 决策控制图</title>
  <desc id="desc">规划 Planning：说明本模块如何参与下一步决策、分支、停止或升级。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.7; }
      .ok { fill: #fefce8; stroke: #854d0e; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .accentCircle { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #0f766e; stroke-width: 2.3; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">09. 规划 Planning - 决策控制图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">说明本模块如何参与下一步决策、分支、停止或升级。</text>
  
  <rect class="accent" x="70" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="88" y="179" text-anchor="start">判断输入</text>
  <text class="small" x="88" y="209" text-anchor="start">如何防止计划本身有问题</text>
  <rect class="card" x="350" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="368" y="179" text-anchor="start">选择路径</text>
  <text class="small" x="368" y="209" text-anchor="start">回答 / 工具 / 澄清 / 暂停 / </text>
  <text class="small" x="368" y="229" text-anchor="start">停止</text>
  <rect class="ok" x="630" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="648" y="179" text-anchor="start">校验约束</text>
  <text class="small" x="648" y="209" text-anchor="start">schema、权限、状态、预算、风险</text>
  <rect class="risk" x="910" y="145" width="150" height="100" rx="14"/>
  <text class="label" x="928" y="179" text-anchor="start">执行或拒绝</text>
  <text class="small" x="928" y="209" text-anchor="start">进入下一步</text>
  <path class="arrow" d="M280 195 H350"/><path class="arrow" d="M560 195 H630"/><path class="arrow" d="M840 195 H910"/>
  <rect class="ok" x="125" y="350" width="230" height="112" rx="14"/>
  <text class="label" x="143" y="384" text-anchor="start">允许继续</text>
  <text class="small" x="143" y="414" text-anchor="start">多步骤、依赖、长时间、多人协作</text>
  <rect class="card" x="445" y="350" width="230" height="112" rx="14"/>
  <text class="label" x="463" y="384" text-anchor="start">需要澄清</text>
  <text class="small" x="463" y="414" text-anchor="start">一个 step 必须包含什么</text>
  <rect class="risk" x="765" y="350" width="230" height="112" rx="14"/>
  <text class="label" x="783" y="384" text-anchor="start">必须停止</text>
  <text class="small" x="783" y="414" text-anchor="start">不估预算：每步估算成本、工具次数和风险</text>
</svg>
