<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">01. Agent 原理 - 责任边界图</title>
  <desc id="desc">模型、应用、工具、状态和人工的边界：从模型能力边界出发，解释 Agent 为什么必须由目标、上下文、工具、状态、权限、验证和 trace 共同组成。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.7; }
      .ok { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .center { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">01. Agent 原理 - 责任边界图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">模型、应用、工具、状态和人工的边界</text>
  
  <rect class="accent" x="70" y="145" width="220" height="120" rx="14"/>
  <text class="label" x="88" y="178" text-anchor="start">模型负责</text>
  <text class="small" x="88" y="207" text-anchor="start">理解输入、生成候选、组织语言、提出下一步</text>
  <rect class="ok" x="330" y="145" width="220" height="120" rx="14"/>
  <text class="label" x="348" y="178" text-anchor="start">应用负责</text>
  <text class="small" x="348" y="207" text-anchor="start">权限、预算、状态、路由、确认、审计</text>
  <rect class="card" x="590" y="145" width="220" height="120" rx="14"/>
  <text class="label" x="608" y="178" text-anchor="start">外部系统负责</text>
  <text class="small" x="608" y="207" text-anchor="start">数据库、文件、API、MCP、队列、工作</text>
  <text class="small" x="608" y="227" text-anchor="start">流</text>
  <rect class="risk" x="850" y="145" width="220" height="120" rx="14"/>
  <text class="label" x="868" y="178" text-anchor="start">人工负责</text>
  <text class="small" x="868" y="207" text-anchor="start">高风险确认、异常复核、策略调整</text>
  <path class="arrow" d="M290 205 H330"/><path class="arrow" d="M550 205 H590"/><path class="arrow" d="M810 205 H850"/>
  <rect class="risk" x="110" y="370" width="260" height="105" rx="14"/>
  <text class="label" x="128" y="403" text-anchor="start">不能混淆</text>
  <text class="small" x="128" y="432" text-anchor="start">缺少停止条件；Loop Controll</text>
  <text class="small" x="128" y="452" text-anchor="start">er 控制轮次</text>
  <rect class="ok" x="430" y="370" width="260" height="105" rx="14"/>
  <text class="label" x="448" y="403" text-anchor="start">边界判断</text>
  <text class="small" x="448" y="432" text-anchor="start">会影响钱、权限、数据、生产系统和信任的动</text>
  <text class="small" x="448" y="452" text-anchor="start">作必须工程兜底</text>
  <rect class="card" x="750" y="370" width="260" height="105" rx="14"/>
  <text class="label" x="768" y="403" text-anchor="start">可验证证据</text>
  <text class="small" x="768" y="432" text-anchor="start">策略判断、确认记录、工具结果和 veri</text>
  <text class="small" x="768" y="452" text-anchor="start">fier 结果都进 trace</text>
</svg>
