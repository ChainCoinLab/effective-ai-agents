<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">传统编程和机器学习的差异</title>
  <desc id="desc">传统编程由人写规则，机器执行；机器学习由人提供数据和反馈，模型从数据中学习规则。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f5d62"/>
    </marker>
    <style>
      .bg { fill: #f8faf7; }
      .panel { fill: #ffffff; stroke: #d7ded3; stroke-width: 2; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
      .head { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #465867; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6f78; }
      .box { fill: #f3f7f5; stroke: #9bb8ad; stroke-width: 2; }
      .box2 { fill: #fff3db; stroke: #d6a64d; stroke-width: 2; }
      .box3 { fill: #eee9f8; stroke: #a99ad0; stroke-width: 2; }
      .arrow { stroke: #2f5d62; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="420"/>
  <text class="title" x="48" y="52">机器学习的起点：规则从哪里来？</text>
  <g transform="translate(64 96)">
    <rect class="panel" width="500" height="260" rx="16"/>
    <text class="head" x="28" y="46">传统编程</text>
    <rect class="box" x="40" y="92" width="120" height="70" rx="10"/>
    <text class="body" x="72" y="121">人写</text>
    <text class="body" x="72" y="145">规则</text>
    <path class="arrow" d="M172 127 H238"/>
    <rect class="box2" x="250" y="92" width="120" height="70" rx="10"/>
    <text class="body" x="282" y="121">机器</text>
    <text class="body" x="282" y="145">执行</text>
    <text class="body" x="40" y="208">适合：规则清楚、分支有限、边界稳定的任务</text>
    <text class="small" x="40" y="236">问题：图像识别、垃圾邮件、自然语言这类任务规则补不完。</text>
  </g>
  <g transform="translate(636 96)">
    <rect class="panel" width="500" height="260" rx="16"/>
    <text class="head" x="28" y="46">机器学习</text>
    <rect class="box2" x="38" y="82" width="112" height="64" rx="10"/>
    <text class="body" x="78" y="111">数据</text>
    <text class="small" x="61" y="132">样本/标签</text>
    <path class="arrow" d="M162 114 H222"/>
    <rect class="box3" x="234" y="82" width="112" height="64" rx="10"/>
    <text class="body" x="273" y="111">训练</text>
    <text class="small" x="254" y="132">猜错再调</text>
    <path class="arrow" d="M358 114 H418"/>
    <rect class="box" x="430" y="82" width="112" height="64" rx="10"/>
    <text class="body" x="469" y="111">模型</text>
    <text class="small" x="459" y="132">学出规则</text>
    <text class="body" x="38" y="208">适合：规则复杂、变化快、需要从样本总结模式的任务</text>
    <text class="small" x="38" y="236">核心：人提供目标和反馈，模型通过训练调整参数。</text>
  </g>
</svg>
