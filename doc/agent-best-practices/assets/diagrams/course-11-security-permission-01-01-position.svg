<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">11. 安全与权限 - 系统位置图</title>
  <desc id="desc">安全与权限：把本课能力放在 Agent Runtime 的全局链路中，说明它解决哪个缺口。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.7; }
      .ok { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .accentCircle { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #c2410c; stroke-width: 2.3; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">11. 安全与权限 - 系统位置图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">把本课能力放在 Agent Runtime 的全局链路中，说明它解决哪个缺口。</text>
  
  <rect class="accent" x="55" y="150" width="210" height="105" rx="14"/>
  <text class="label" x="73" y="184" text-anchor="start">本课解决</text>
  <text class="small" x="73" y="214" text-anchor="start">Agent 会处理用户输入、检索文档、</text>
  <text class="small" x="73" y="234" text-anchor="start">工具返回和外部网页，这些内容都可能携带</text>
  <text class="small" x="73" y="254" text-anchor="start">恶意指令</text>
  <rect class="card" x="320" y="150" width="210" height="105" rx="14"/>
  <text class="label" x="338" y="184" text-anchor="start">核心目标</text>
  <text class="small" x="338" y="214" text-anchor="start">建立威胁模型、权限校验、高风险确认、注</text>
  <text class="small" x="338" y="234" text-anchor="start">入防御、数据最小化和安全评估。</text>
  <rect class="ok" x="585" y="150" width="210" height="105" rx="14"/>
  <text class="label" x="603" y="184" text-anchor="start">工程公式</text>
  <text class="small" x="603" y="214" text-anchor="start">安全原则：模型不可信，外部内容不可信，</text>
  <text class="small" x="603" y="234" text-anchor="start">权限不由模型判断，高风险动作必须可确认</text>
  <text class="small" x="603" y="254" text-anchor="start">和可审计。</text>
  <rect class="card" x="850" y="150" width="210" height="105" rx="14"/>
  <text class="label" x="868" y="184" text-anchor="start">验收方向</text>
  <text class="small" x="868" y="214" text-anchor="start">为一个邮件发送 Agent 设计安全策</text>
  <text class="small" x="868" y="234" text-anchor="start">略：读取邮件只读、草稿可自动生成、发送</text>
  <text class="small" x="868" y="254" text-anchor="start">必须确认，敏感</text>
  <path class="arrow" d="M265 202 H320"/><path class="arrow" d="M530 202 H585"/><path class="arrow" d="M795 202 H850"/>
  <rect class="card" x="90" y="350" width="170" height="92" rx="14"/>
  <text class="label" x="108" y="384" text-anchor="start">第一步</text>
  <text class="small" x="108" y="414" text-anchor="start">11.1 威胁模型：Agent 面临哪</text>
  <text class="small" x="108" y="434" text-anchor="start">些攻击面</text>
  <rect class="card" x="295" y="350" width="170" height="92" rx="14"/>
  <text class="label" x="313" y="384" text-anchor="start">第二步</text>
  <text class="small" x="313" y="414" text-anchor="start">11.2 权限系统：谁能对什么做什么</text>
  <rect class="card" x="500" y="350" width="170" height="92" rx="14"/>
  <text class="label" x="518" y="384" text-anchor="start">第三步</text>
  <text class="small" x="518" y="414" text-anchor="start">11.3 Prompt Injecti</text>
  <text class="small" x="518" y="434" text-anchor="start">on：外部内容如何污染指令</text>
  <rect class="card" x="705" y="350" width="170" height="92" rx="14"/>
  <text class="label" x="723" y="384" text-anchor="start">落地对象</text>
  <text class="small" x="723" y="414" text-anchor="start">Threat Model / Poli</text>
  <text class="small" x="723" y="434" text-anchor="start">cy Engine / Permiss</text>
  <text class="small" x="723" y="454" text-anchor="start">ion Check</text>
  <rect class="risk" x="910" y="350" width="170" height="92" rx="14"/>
  <text class="label" x="928" y="384" text-anchor="start">质量闸门</text>
  <text class="small" x="928" y="414" text-anchor="start">trace、状态、评估和回归</text>
  <path class="arrow" d="M260 396 H295"/><path class="arrow" d="M465 396 H500"/><path class="arrow" d="M670 396 H705"/><path class="arrow" d="M875 396 H910"/>
</svg>
