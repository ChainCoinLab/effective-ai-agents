<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">03. Prompt 与指令工程 - 系统位置图</title>
  <desc id="desc">本节在 Agent 全局链路中的位置：把 Prompt 从一次性文本变成可版本化、可测试、可回滚的工程资产。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.7; }
      .ok { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .center { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">03. Prompt 与指令工程 - 系统位置图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">本节在 Agent 全局链路中的位置</text>
  
  <rect class="accent" x="70" y="145" width="230" height="112" rx="14"/>
  <text class="label" x="88" y="178" text-anchor="start">本节解决什么</text>
  <text class="small" x="88" y="207" text-anchor="start">把 Prompt 从一次性文本变成可版本</text>
  <text class="small" x="88" y="227" text-anchor="start">化、可测试、可回滚的工程资产。</text>
  <rect class="card" x="345" y="145" width="210" height="112" rx="14"/>
  <text class="label" x="363" y="178" text-anchor="start">上游输入</text>
  <text class="small" x="363" y="207" text-anchor="start">用户目标、任务约束、已有证据和系统规则</text>
  <rect class="ok" x="600" y="145" width="210" height="112" rx="14"/>
  <text class="label" x="618" y="178" text-anchor="start">本节处理</text>
  <text class="small" x="618" y="207" text-anchor="start">任务定义 / 角色边界 / 指令层级</text>
  <rect class="card" x="855" y="145" width="200" height="112" rx="14"/>
  <text class="label" x="873" y="178" text-anchor="start">下游输出</text>
  <text class="small" x="873" y="207" text-anchor="start">结构化结果、状态变化、trace 和评估</text>
  <text class="small" x="873" y="227" text-anchor="start">样例</text>
  <path class="arrow" d="M300 201 H345"/><path class="arrow" d="M555 201 H600"/><path class="arrow" d="M810 201 H855"/>
  <rect class="ok" x="110" y="365" width="260" height="105" rx="14"/>
  <text class="label" x="128" y="398" text-anchor="start">关键原则</text>
  <text class="small" x="128" y="427" text-anchor="start">Prompt 只负责当前调用的行为约束；</text>
  <text class="small" x="128" y="447" text-anchor="start">长期知识、状态、权限不能放进 Promp</text>
  <text class="small" x="128" y="467" text-anchor="start">t</text>
  <rect class="card" x="430" y="365" width="260" height="105" rx="14"/>
  <text class="label" x="448" y="398" text-anchor="start">工程原因</text>
  <text class="small" x="448" y="427" text-anchor="start">Prompt 可以表达意图，不能替代系统</text>
  <text class="small" x="448" y="447" text-anchor="start">边界</text>
  <rect class="accent" x="750" y="365" width="260" height="105" rx="14"/>
  <text class="label" x="768" y="398" text-anchor="start">验收证据</text>
  <text class="small" x="768" y="427" text-anchor="start">能在 trace、状态、评估样例和图谱中</text>
  <text class="small" x="768" y="447" text-anchor="start">被复核</text>
</svg>
