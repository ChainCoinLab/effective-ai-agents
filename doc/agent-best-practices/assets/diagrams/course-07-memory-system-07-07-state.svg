<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">07. 记忆系统 Memory - 状态与证据图</title>
  <desc id="desc">记忆系统 Memory：说明哪些信息要进入状态、trace、证据库或短期上下文。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.7; }
      .ok { fill: #fefce8; stroke: #854d0e; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .accentCircle { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #0f766e; stroke-width: 2.3; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">07. 记忆系统 Memory - 状态与证据图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">说明哪些信息要进入状态、trace、证据库或短期上下文。</text>
  
  <rect class="accent" x="75" y="150" width="220" height="105" rx="14"/>
  <text class="label" x="93" y="184" text-anchor="start">进入上下文</text>
  <text class="small" x="93" y="214" text-anchor="start">本轮模型需要的最少信息：目标、约束、相</text>
  <text class="small" x="93" y="234" text-anchor="start">关证据</text>
  <rect class="ok" x="330" y="150" width="220" height="105" rx="14"/>
  <text class="label" x="348" y="184" text-anchor="start">进入状态</text>
  <text class="small" x="348" y="214" text-anchor="start">任务进度、可信事实、checkpoin</text>
  <text class="small" x="348" y="234" text-anchor="start">t、预算</text>
  <rect class="card" x="585" y="150" width="220" height="105" rx="14"/>
  <text class="label" x="603" y="184" text-anchor="start">进入 Trace</text>
  <text class="small" x="603" y="214" text-anchor="start">每轮输入、输出、工具参数、错误和耗时</text>
  <rect class="card" x="840" y="150" width="220" height="105" rx="14"/>
  <text class="label" x="858" y="184" text-anchor="start">进入证据库</text>
  <text class="small" x="858" y="214" text-anchor="start">原文、文件、工具原始结果和 artif</text>
  <text class="small" x="858" y="234" text-anchor="start">act</text>
  <path class="arrow" d="M295 202 H330"/><path class="arrow" d="M550 202 H585"/><path class="arrow" d="M805 202 H840"/>
  <rect class="risk" x="110" y="365" width="260" height="108" rx="14"/>
  <text class="label" x="128" y="399" text-anchor="start">不要混用</text>
  <text class="small" x="128" y="429" text-anchor="start">自动记住一切：只写稳定、明确、可复用的</text>
  <text class="small" x="128" y="449" text-anchor="start">信息</text>
  <rect class="ok" x="430" y="365" width="260" height="108" rx="14"/>
  <text class="label" x="448" y="399" text-anchor="start">分层原因</text>
  <text class="small" x="448" y="429" text-anchor="start">生命周期、可信度、体积和访问权限都不同</text>
  <rect class="card" x="750" y="365" width="260" height="108" rx="14"/>
  <text class="label" x="768" y="399" text-anchor="start">本课落点</text>
  <text class="small" x="768" y="429" text-anchor="start">Memory Record / Mem</text>
  <text class="small" x="768" y="449" text-anchor="start">ory Type / Source / </text>
  <text class="small" x="768" y="469" text-anchor="start">Confidence</text>
</svg>
