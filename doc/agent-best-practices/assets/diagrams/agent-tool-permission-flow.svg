<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">工具调用与权限流</title>
  <desc id="desc">展示模型提出工具调用意图，应用校验参数和权限，高风险动作需要用户确认，再执行工具并返回结果。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #fff; stroke: #1f2937; stroke-width: 1.5; rx: 14; }
      .model { fill: #f3e8ff; stroke: #7e22ce; }
      .app { fill: #dbeafe; stroke: #1d4ed8; }
      .risk { fill: #fee2e2; stroke: #991b1b; }
      .ok { fill: #dcfce7; stroke: #166534; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .no { stroke: #991b1b; stroke-width: 2.2; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="48" y="58">工具调用：模型提出意图，应用负责校验、授权、执行和审计</text>

  <rect class="box model" x="70" y="150" width="210" height="105"/>
  <text class="label" x="112" y="188">Model</text>
  <text class="small" x="102" y="218">生成 tool call</text>
  <text class="tiny" x="102" y="240">name + arguments</text>

  <rect class="box app" x="350" y="150" width="230" height="105"/>
  <text class="label" x="398" y="188">Schema 校验</text>
  <text class="small" x="382" y="218">类型、必填、范围、路径</text>
  <text class="tiny" x="382" y="240">失败返回结构化错误</text>

  <rect class="box app" x="650" y="150" width="230" height="105"/>
  <text class="label" x="698" y="188">权限策略</text>
  <text class="small" x="682" y="218">身份、资源、动作、风险</text>
  <text class="tiny" x="682" y="240">intent 不是 permission</text>

  <rect class="box risk" x="800" y="340" width="230" height="105"/>
  <text class="label" x="850" y="378">用户确认</text>
  <text class="small" x="832" y="408">绑定具体动作和参数</text>
  <text class="tiny" x="832" y="430">确认 token 有时效</text>

  <rect class="box ok" x="485" y="340" width="230" height="105"/>
  <text class="label" x="545" y="378">执行工具</text>
  <text class="small" x="517" y="408">API / MCP / 文件 / 数据库</text>
  <text class="tiny" x="517" y="430">带超时、重试、幂等</text>

  <rect class="box" x="175" y="340" width="230" height="105"/>
  <text class="label" x="232" y="378">ToolResult</text>
  <text class="small" x="207" y="408">output / error / source</text>
  <text class="tiny" x="207" y="430">返回模型作为 observation</text>

  <path class="arrow" d="M280 202 H350"/>
  <path class="arrow" d="M580 202 H650"/>
  <path class="arrow" d="M765 255 C765 295 870 300 895 340"/>
  <path class="arrow" d="M800 392 H715"/>
  <path class="arrow" d="M650 255 C640 295 615 305 600 340"/>
  <path class="arrow" d="M485 392 H405"/>
  <path class="arrow" d="M290 340 C250 305 190 300 175 255"/>
  <path class="no" d="M465 255 C450 300 380 300 360 340"/>
  <text class="tiny" x="337" y="330">校验失败</text>

  <rect class="box" x="80" y="515" width="960" height="55"/>
  <text class="small" x="110" y="548">高风险动作不能只问“是否允许 Agent 操作”，必须确认具体资源、具体参数、具体副作用，并写入审计日志。</text>
</svg>
