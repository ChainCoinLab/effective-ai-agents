<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">16. 综合实战项目 - 落地闭环图</title>
  <desc id="desc">综合实战项目：用一个闭环总结学习重点：设计、实现、验证、上线和迭代。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #f1f5f9; stroke: #334155; stroke-width: 1.7; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .accentCircle { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #334155; stroke-width: 2.3; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">16. 综合实战项目 - 落地闭环图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">用一个闭环总结学习重点：设计、实现、验证、上线和迭代。</text>
  
  <circle class="accentCircle" cx="560" cy="305" r="86"/>
  <text class="centerTitle" x="560" y="292" text-anchor="middle">综合实战项目</text>
  <text class="centerSmall" x="560" y="323" text-anchor="middle">工程闭环</text>
  <rect class="accent" x="80" y="105" width="220" height="100" rx="14"/>
  <text class="label" x="98" y="139" text-anchor="start">1. 设计</text>
  <text class="small" x="98" y="169" text-anchor="start">完成从需求分析到架构、实现、评估、上线</text>
  <text class="small" x="98" y="189" text-anchor="start">检查的端到端 Agent 项目。</text>
  <rect class="card" x="820" y="105" width="220" height="100" rx="14"/>
