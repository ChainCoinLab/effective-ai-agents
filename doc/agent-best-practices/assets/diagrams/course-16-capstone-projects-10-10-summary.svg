  <text class="small" x="838" y="169" text-anchor="start">落地对象：Project Brief </text>
  <text class="small" x="838" y="189" text-anchor="start">/ Architecture / Ru</text>
  <text class="small" x="838" y="209" text-anchor="start">ntime</text>
  <rect class="ok" x="820" y="430" width="220" height="100" rx="14"/>
