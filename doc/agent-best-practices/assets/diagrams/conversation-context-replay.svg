<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">多轮对话的上下文重放</title>
  <desc id="desc">展示每轮调用大模型时，应用会把系统指令、工具定义、项目文档、会话上下文、外部记忆、工具结果、历史消息和当前用户输入一起组装成上下文发送给模型。</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#e66b48"/>
    </marker>
    <style>
      .bg { fill: #151510; }
      .grid { stroke: #26261e; stroke-width: 1; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f2eee3; letter-spacing: 0; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aaa393; }
      .layer { fill: #1d1c16; stroke: #373429; stroke-width: 2; }
      .layer-dim { fill: #191811; stroke: #2a281f; stroke-width: 2; }
      .layer-hot { fill: #241c16; stroke: #e65f3f; stroke-width: 3; filter: url(#softGlow); }
      .num { font: italic 28px Georgia, "Times New Roman", serif; fill: #7d7765; }
      .num-hot { font: italic 28px Georgia, "Times New Roman", serif; fill: #ff7c55; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c4beb0; letter-spacing: .5px; }
      .label-hot { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffe0d2; letter-spacing: .5px; }
      .cn { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b7b0a2; }
      .cn-hot { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ff704c; }
      .code { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8f8879; }
      .code-hot { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f1d4c8; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8f8879; }
      .brace { stroke: #575244; stroke-width: 2; fill: none; }
      .arrow { stroke: #e66b48; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .model { fill: #f6efe4; stroke: #e66b48; stroke-width: 3; }
      .modelText { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191811; }
      .modelSmall { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f463d; }
      .pill { fill: #2a241b; stroke: #5c4a35; stroke-width: 1.5; }
      .pillText { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d1c5b2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <g opacity=".35">
    <path class="grid" d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M0 600 H1200"/>
    <path class="grid" d="M120 0 V760 M240 0 V760 M360 0 V760 M480 0 V760 M600 0 V760 M720 0 V760 M840 0 V760 M960 0 V760 M1080 0 V760"/>
  </g>

  <text class="title" x="42" y="56">多轮对话：每一轮都把上下文包重新发给大模型</text>
  <text class="subtitle" x="42" y="84">看起来像模型“记住了”，实际是应用把历史、记忆、工具结果和当前输入重新组装成 prompt/context。</text>

  <g transform="translate(54 120)">
    <rect class="layer-dim" x="0" y="420" width="760" height="112" rx="2"/>
    <text class="num" x="42" y="457">01</text>
    <text class="label" x="106" y="450">system_prompt + tool_definitions</text>
    <text class="cn" x="610" y="450">系统指令 + 工具定义</text>
    <path class="brace" d="M78 470 V510"/>
    <text class="code" x="106" y="482">role: "You are a helpful AI assistant."</text>
    <text class="code" x="106" y="508">tools: [ search, read_file, edit_file, calculator, api_call ]</text>

    <rect class="layer-dim" x="0" y="286" width="760" height="112" rx="2"/>
    <text class="num" x="42" y="323">02</text>
    <text class="label" x="106" y="316">project_docs / knowledge</text>
    <text class="cn" x="644" y="316">项目文档 / 知识</text>
    <path class="brace" d="M78 336 V376"/>
    <text class="code" x="106" y="348">CLAUDE.md, README.md, product_rules.md</text>
    <text class="code" x="106" y="374">retrieved_docs: [ policy.txt, order.css, faq.md ]</text>

    <rect class="layer-dim" x="0" y="152" width="760" height="112" rx="2"/>
    <text class="num" x="42" y="189">03</text>
    <text class="label" x="106" y="182">session_context + memory + tool_results</text>
    <text class="cn" x="570" y="182">会话上下文 / 记忆 / 工具结果</text>
    <path class="brace" d="M78 202 V242"/>
    <text class="code" x="106" y="214">memory: user prefers concise Chinese explanations</text>
    <text class="code" x="106" y="240">tool_result: order_status = "paid"; trace_id = "run_42"</text>

    <rect class="layer-hot" x="0" y="0" width="760" height="130" rx="2"/>
    <text class="num-hot" x="42" y="40">04</text>
    <text class="label-hot" x="106" y="34">messages</text>
    <text class="cn-hot" x="648" y="34">对话消息</text>
    <path class="brace" d="M78 54 V106" stroke="#a5543c"/>
    <text class="code-hot" x="106" y="62">user    - turn 1 - "帮我分析这个订单"</text>
    <text class="code-hot" x="106" y="88">assistant- turn 1 - "订单已支付，但缺少发票信息"</text>
    <text class="code-hot" x="106" y="114">user    - turn 2 - new current input</text>

    <path class="arrow" d="M790 266 C870 266, 890 266, 960 266"/>

    <g transform="translate(982 188)">
      <rect class="model" width="148" height="156" rx="24"/>
      <path d="M52 44 L52 112 L108 78 Z" fill="#151510"/>
      <text class="modelText" x="28" y="130">LLM</text>
      <text class="modelSmall" x="28" y="150">predict next token</text>
    </g>

    <g transform="translate(0 562)">
      <rect class="pill" x="0" y="0" width="206" height="38" rx="19"/>
      <text class="pillText" x="20" y="24">每轮重新组装上下文</text>
      <rect class="pill" x="222" y="0" width="214" height="38" rx="19"/>
      <text class="pillText" x="242" y="24">历史太长要筛选和压缩</text>
      <rect class="pill" x="452" y="0" width="210" height="38" rx="19"/>
      <text class="pillText" x="472" y="24">重要信息写入外部记忆</text>
      <rect class="pill" x="678" y="0" width="254" height="38" rx="19"/>
      <text class="pillText" x="698" y="24">工具结果和状态要可回放</text>
    </g>
  </g>

  <text class="note" x="54" y="716">工程含义：Prompt 工程决定底层规则如何写；上下文工程决定每轮放什么、按什么顺序放；记忆工程决定哪些信息不能只靠聊天历史。</text>
</svg>
