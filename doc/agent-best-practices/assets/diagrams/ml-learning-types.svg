<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">三种机器学习方式</title>
  <desc id="desc">对比监督学习、无监督学习和强化学习：监督学习依赖标签答案，无监督学习从无标签数据中发现结构，强化学习在环境中根据奖励试错。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#315d61"/>
    </marker>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #213137; letter-spacing: 0; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #637173; }
      .panel { fill: #ffffff; stroke: #d9ded8; stroke-width: 2; }
      .head { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22333b; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #49595f; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667477; }
      .label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334448; }
      .boxA { fill: #eef7f5; stroke: #9bc0b8; stroke-width: 2; }
      .boxB { fill: #fff4dd; stroke: #dfbd70; stroke-width: 2; }
      .boxC { fill: #f0edf9; stroke: #ad9bd0; stroke-width: 2; }
      .boxD { fill: #edf4ff; stroke: #92afd2; stroke-width: 2; }
      .arrow { stroke: #315d61; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #b7c4c0; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .chip { fill: #f7faf8; stroke: #d8ded8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="52" y="58">三种学习方式：答案、结构、奖励</text>
  <text class="subtitle" x="52" y="86">机器学习不是一种单一训练套路，关键差别在于训练时给模型什么反馈。</text>

  <g transform="translate(52 128)">
    <rect class="panel" width="340" height="410" rx="18"/>
    <text class="head" x="28" y="44">监督学习</text>
    <text class="small" x="28" y="70">有标签，有标准答案</text>

    <rect class="boxA" x="36" y="108" width="112" height="66" rx="12"/>
    <text class="label" x="58" y="136">样本 x</text>
    <text class="small" x="56" y="156">猫图 / 邮件</text>
    <path class="arrow" d="M156 141 H200"/>
    <rect class="boxB" x="208" y="108" width="96" height="66" rx="12"/>
    <text class="label" x="236" y="136">标签 y</text>
    <text class="small" x="230" y="156">猫 / 垃圾</text>

    <path class="arrow" d="M92 188 C92 216, 120 226, 154 226"/>
    <rect class="boxC" x="154" y="196" width="132" height="62" rx="12"/>
    <text class="label" x="192" y="223">模型预测</text>
    <text class="small" x="184" y="244">和答案比较</text>

    <text class="body" x="28" y="302">典型任务：分类、识别、翻译、语音转写、医学影像诊断。</text>
    <text class="small" x="28" y="344">核心反馈：这一次猜对了吗？错得多严重？</text>
  </g>

  <g transform="translate(430 128)">
    <rect class="panel" width="340" height="410" rx="18"/>
    <text class="head" x="28" y="44">无监督学习</text>
    <text class="small" x="28" y="70">没有标签，自己找结构</text>

    <rect class="boxD" x="42" y="105" width="250" height="78" rx="14"/>
    <text class="label" x="74" y="134">大量无标签行为数据</text>
    <text class="small" x="74" y="158">浏览、点击、购买、观看记录</text>

    <path class="arrow" d="M166 194 V232"/>
    <g transform="translate(70 242)">
      <circle cx="38" cy="34" r="20" fill="#8dbab2"/>
      <circle cx="75" cy="50" r="16" fill="#8dbab2"/>
      <circle cx="54" cy="76" r="13" fill="#8dbab2"/>
      <circle cx="156" cy="34" r="19" fill="#d7b769"/>
      <circle cx="196" cy="52" r="15" fill="#d7b769"/>
      <circle cx="172" cy="78" r="13" fill="#d7b769"/>
      <path class="soft" d="M108 56 H136"/>
    </g>

    <text class="body" x="28" y="302">典型任务：聚类、关联发现、推荐候选、异常检测。</text>
    <text class="small" x="28" y="344">核心反馈：数据里哪些样本彼此更像？哪些行为经常一起出现？</text>
  </g>

  <g transform="translate(808 128)">
    <rect class="panel" width="340" height="410" rx="18"/>
    <text class="head" x="28" y="44">强化学习</text>
    <text class="small" x="28" y="70">没有固定答案，在环境里试错</text>

    <rect class="boxA" x="44" y="108" width="106" height="58" rx="12"/>
    <text class="label" x="78" y="134">策略</text>
    <text class="small" x="64" y="153">选择动作</text>
    <path class="arrow" d="M158 137 H196"/>
    <rect class="boxD" x="204" y="108" width="92" height="58" rx="12"/>
    <text class="label" x="236" y="134">环境</text>
    <text class="small" x="226" y="153">返回结果</text>
    <path class="arrow" d="M250 174 C250 216, 96 216, 96 174"/>

    <rect class="boxB" x="88" y="232" width="164" height="62" rx="12"/>
    <text class="label" x="134" y="258">奖励 / 惩罚</text>
    <text class="small" x="118" y="279">更新下一次策略</text>

    <text class="body" x="28" y="332">典型任务：游戏、自我对弈、机器人控制、偏好优化中的奖励信号。</text>
    <text class="small" x="28" y="374">核心反馈：这个动作让长期目标变好还是变差？</text>
  </g>

  <g transform="translate(80 560)">
    <rect class="chip" width="1040" height="34" rx="17"/>
    <text class="small" x="28" y="22">共同底层：模型先猜，再根据反馈调整参数；区别在于反馈来自标签、数据结构，还是环境奖励。</text>
  </g>
</svg>
