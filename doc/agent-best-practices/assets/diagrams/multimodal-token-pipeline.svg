<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">多模态 token 统一入口</title>
  <desc id="desc">图片通过 ViT、CLIP 和 projector 转成视觉 token，文本通过 tokenizer 转成文本 token，两者拼接后输入 LLM。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f5d62"/>
    </marker>
    <style>
      .bg { fill: #f7f4ed; }
      .card { fill: #ffffff; stroke: #d8d1c3; stroke-width: 2; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
      .head { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #425466; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #65727b; }
      .arrow { stroke: #2f5d62; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tokenV { fill: #e7f0ed; stroke: #8fb5aa; stroke-width: 2; }
      .tokenT { fill: #fff0d3; stroke: #d6a64d; stroke-width: 2; }
      .tokenM { fill: #eee9f8; stroke: #a99ad0; stroke-width: 2; }
      .image { fill: #f2e8d5; stroke: #b89d6f; stroke-width: 2; }
      .mountain { fill: #8fb5aa; }
      .sun { fill: #f4c978; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="430"/>
  <text class="title" x="48" y="52">多模态大模型：把不同输入都变成 token</text>
  <g transform="translate(52 92)">
    <rect class="card" width="180" height="112" rx="14"/>
    <text class="head" x="24" y="36">图片</text>
    <rect class="image" x="24" y="52" width="92" height="42" rx="6"/>
    <circle class="sun" cx="92" cy="64" r="8"/>
    <path class="mountain" d="M28 94 L54 72 L72 88 L88 76 L112 94 Z"/>
    <text class="small" x="126" y="78">像素矩阵</text>
  </g>
  <path class="arrow" d="M244 148 H302"/>
  <g transform="translate(318 92)">
    <rect class="card" width="190" height="112" rx="14"/>
    <text class="head" x="24" y="36">ViT / CLIP</text>
    <rect class="tokenV" x="28" y="58" width="30" height="30" rx="6"/>
    <rect class="tokenV" x="66" y="58" width="30" height="30" rx="6"/>
    <rect class="tokenV" x="104" y="58" width="30" height="30" rx="6"/>
    <rect class="tokenV" x="142" y="58" width="30" height="30" rx="6"/>
    <text class="small" x="24" y="102">patch → 视觉语义</text>
  </g>
  <path class="arrow" d="M520 148 H578"/>
  <g transform="translate(594 92)">
    <rect class="card" width="180" height="112" rx="14"/>
    <text class="head" x="24" y="36">Projector</text>
    <text class="body" x="24" y="68">映射到</text>
    <text class="body" x="24" y="92">LLM embedding 空间</text>
  </g>
  <g transform="translate(52 250)">
    <rect class="card" width="180" height="92" rx="14"/>
    <text class="head" x="24" y="36">文本</text>
    <text class="body" x="24" y="66">“图里有什么？”</text>
  </g>
  <path class="arrow" d="M244 296 H302"/>
  <g transform="translate(318 250)">
    <rect class="card" width="190" height="92" rx="14"/>
    <text class="head" x="24" y="34">Tokenizer</text>
    <rect class="tokenT" x="28" y="52" width="30" height="24" rx="6"/>
    <rect class="tokenT" x="66" y="52" width="30" height="24" rx="6"/>
    <rect class="tokenT" x="104" y="52" width="30" height="24" rx="6"/>
    <rect class="tokenT" x="142" y="52" width="30" height="24" rx="6"/>
  </g>
  <path class="arrow" d="M786 148 C842 148, 842 204, 884 204"/>
  <path class="arrow" d="M520 296 C718 296, 742 226, 884 226"/>
  <g transform="translate(900 138)">
    <rect class="card" width="244" height="158" rx="16"/>
    <text class="head" x="24" y="38">拼接成同一串 token</text>
    <rect class="tokenV" x="28" y="64" width="28" height="28" rx="6"/>
    <rect class="tokenV" x="64" y="64" width="28" height="28" rx="6"/>
    <rect class="tokenV" x="100" y="64" width="28" height="28" rx="6"/>
    <rect class="tokenT" x="136" y="64" width="28" height="28" rx="6"/>
    <rect class="tokenT" x="172" y="64" width="28" height="28" rx="6"/>
    <rect class="tokenM" x="82" y="112" width="86" height="28" rx="8"/>
    <text class="small" x="104" y="132">LLM</text>
  </g>
  <text class="body" x="52" y="388">结论：多模态的关键不是给 Transformer 换一套完全不同的推理接口，而是把图片、文字等输入对齐成 token 序列。</text>
</svg>
