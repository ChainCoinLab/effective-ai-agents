<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">二维坐标分类线训练示意</title>
  <desc id="desc">模型从一条错误的分类线开始，根据分错的样本调整参数，逐步得到更好的分类边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f5d62"/>
    </marker>
    <style>
      .bg { fill: #f7f4ed; }
      .panel { fill: #ffffff; stroke: #d8d1c3; stroke-width: 2; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
      .head { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #425466; }
      .axis { stroke: #6d7f88; stroke-width: 2; }
      .grid { stroke: #e3ded3; stroke-width: 1; }
      .bad { stroke: #b85c48; stroke-width: 4; stroke-dasharray: 10 8; }
      .good { stroke: #2f5d62; stroke-width: 5; }
      .blue { fill: #8fb5aa; stroke: #2f5d62; stroke-width: 2; }
      .orange { fill: #f4c978; stroke: #a76d18; stroke-width: 2; }
      .error { fill: none; stroke: #b85c48; stroke-width: 3; }
      .arrow { stroke: #2f5d62; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .step { fill: #ffffff; stroke: #d8d1c3; stroke-width: 2; }
      .stepText { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text class="title" x="48" y="52">二维坐标找一条线：机器学习的最小直觉</text>
  <g transform="translate(62 92)">
    <rect class="panel" width="620" height="360" rx="16"/>
    <text class="head" x="26" y="42">从错误分类线到更好的分类边界</text>
    <g transform="translate(80 72)">
      <line class="grid" x1="0" y1="40" x2="460" y2="40"/>
      <line class="grid" x1="0" y1="100" x2="460" y2="100"/>
      <line class="grid" x1="0" y1="160" x2="460" y2="160"/>
      <line class="grid" x1="0" y1="220" x2="460" y2="220"/>
      <line class="grid" x1="90" y1="0" x2="90" y2="270"/>
      <line class="grid" x1="180" y1="0" x2="180" y2="270"/>
      <line class="grid" x1="270" y1="0" x2="270" y2="270"/>
      <line class="grid" x1="360" y1="0" x2="360" y2="270"/>
      <line class="axis" x1="0" y1="270" x2="470" y2="270"/>
      <line class="axis" x1="0" y1="270" x2="0" y2="0"/>
      <circle class="blue" cx="78" cy="222" r="10"/>
      <circle class="blue" cx="118" cy="190" r="10"/>
      <circle class="blue" cx="156" cy="220" r="10"/>
      <circle class="blue" cx="200" cy="174" r="10"/>
      <circle class="blue" cx="244" cy="202" r="10"/>
      <circle class="orange" cx="220" cy="86" r="10"/>
      <circle class="orange" cx="272" cy="116" r="10"/>
      <circle class="orange" cx="316" cy="72" r="10"/>
      <circle class="orange" cx="354" cy="118" r="10"/>
      <circle class="orange" cx="396" cy="72" r="10"/>
      <line class="bad" x1="70" y1="54" x2="395" y2="228"/>
      <line class="good" x1="84" y1="252" x2="410" y2="36"/>
      <circle class="error" cx="220" cy="86" r="18"/>
      <circle class="error" cx="244" cy="202" r="18"/>
      <text class="body" x="300" y="238">虚线：初始猜测</text>
      <text class="body" x="300" y="262">实线：训练后边界</text>
    </g>
  </g>
  <g transform="translate(732 104)">
    <rect class="step" x="0" y="0" width="360" height="64" rx="12"/>
    <text class="stepText" x="24" y="39">1. 先猜一个规则</text>
    <path class="arrow" d="M180 76 V112"/>
    <rect class="step" x="0" y="124" width="360" height="64" rx="12"/>
    <text class="stepText" x="24" y="163">2. 用已知答案检查错误</text>
    <path class="arrow" d="M180 200 V236"/>
    <rect class="step" x="0" y="248" width="360" height="64" rx="12"/>
    <text class="stepText" x="24" y="287">3. 根据错误调整参数</text>
    <path class="arrow" d="M180 324 V360"/>
    <rect class="step" x="0" y="372" width="360" height="64" rx="12"/>
    <text class="stepText" x="24" y="411">4. 再猜，继续迭代</text>
  </g>
  <text class="body" x="62" y="488">复杂大模型也是这个循环，只是“一条线”变成了海量参数，训练目标从简单分类扩展到预测下一个 token。</text>
</svg>
