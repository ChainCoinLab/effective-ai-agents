<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">从线性模型到多层神经网络</title>
  <desc id="desc">左侧展示线性模型只能形成一条简单边界，右侧展示多层神经网络通过隐藏层和激活函数逐步形成抽象表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f5d62"/>
    </marker>
    <style>
      .bg { fill: #f7f4ed; }
      .panel { fill: #ffffff; stroke: #d8d1c3; stroke-width: 2; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
      .head { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #425466; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6873; }
      .grid { stroke: #e3ded3; stroke-width: 1; }
      .axis { stroke: #70828a; stroke-width: 2; }
      .line { stroke: #b85c48; stroke-width: 5; }
      .curve { fill: none; stroke: #2f5d62; stroke-width: 5; }
      .blue { fill: #8fb5aa; stroke: #2f5d62; stroke-width: 2; }
      .orange { fill: #f4c978; stroke: #a76d18; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #2f5d62; stroke-width: 3; }
      .node2 { fill: #fff8e8; stroke: #a76d18; stroke-width: 3; }
      .edge { stroke: #8fa1a8; stroke-width: 2; }
      .arrow { stroke: #2f5d62; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tag { fill: #eef5f2; stroke: #c7d8d2; stroke-width: 1; }
      .tagText { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f5d62; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="48" y="52">从一条线到多层非线性表示</text>
  <g transform="translate(52 88)">
    <rect class="panel" width="500" height="382" rx="14"/>
    <text class="head" x="26" y="42">线性模型：只能画一条直边界</text>
    <g transform="translate(58 74)">
      <line class="grid" x1="0" y1="50" x2="382" y2="50"/>
      <line class="grid" x1="0" y1="105" x2="382" y2="105"/>
      <line class="grid" x1="0" y1="160" x2="382" y2="160"/>
      <line class="grid" x1="0" y1="215" x2="382" y2="215"/>
      <line class="grid" x1="75" y1="0" x2="75" y2="265"/>
      <line class="grid" x1="150" y1="0" x2="150" y2="265"/>
      <line class="grid" x1="225" y1="0" x2="225" y2="265"/>
      <line class="grid" x1="300" y1="0" x2="300" y2="265"/>
      <line class="axis" x1="0" y1="265" x2="392" y2="265"/>
      <line class="axis" x1="0" y1="265" x2="0" y2="0"/>
      <circle class="orange" cx="194" cy="126" r="10"/>
      <circle class="orange" cx="216" cy="146" r="10"/>
      <circle class="orange" cx="188" cy="168" r="10"/>
      <circle class="orange" cx="230" cy="182" r="10"/>
      <circle class="orange" cx="252" cy="136" r="10"/>
      <circle class="blue" cx="76" cy="214" r="10"/>
      <circle class="blue" cx="95" cy="62" r="10"/>
      <circle class="blue" cx="334" cy="205" r="10"/>
      <circle class="blue" cx="318" cy="72" r="10"/>
      <circle class="blue" cx="58" cy="122" r="10"/>
      <circle class="blue" cx="282" cy="246" r="10"/>
      <line class="line" x1="74" y1="32" x2="324" y2="238"/>
      <text class="small" x="206" y="34">w*x + b</text>
      <text class="body" x="0" y="306">当类别关系是弯曲或组合条件时，</text>
      <text class="body" x="0" y="330">单条线无法表达稳定边界。</text>
    </g>
  </g>
  <path class="arrow" d="M570 280 H638"/>
  <g transform="translate(668 88)">
    <rect class="panel" width="480" height="382" rx="14"/>
    <text class="head" x="26" y="42">神经网络：多层组合出复杂边界</text>
    <g transform="translate(34 76)">
      <g>
        <circle class="node" cx="20" cy="40" r="16"/>
        <circle class="node" cx="20" cy="118" r="16"/>
        <circle class="node" cx="20" cy="196" r="16"/>
        <text class="small" x="0" y="246">输入特征</text>
      </g>
      <g>
        <circle class="node2" cx="148" cy="20" r="16"/>
        <circle class="node2" cx="148" cy="82" r="16"/>
        <circle class="node2" cx="148" cy="144" r="16"/>
        <circle class="node2" cx="148" cy="206" r="16"/>
        <text class="small" x="118" y="246">隐藏层 1</text>
      </g>
      <g>
        <circle class="node2" cx="276" cy="50" r="16"/>
        <circle class="node2" cx="276" cy="128" r="16"/>
        <circle class="node2" cx="276" cy="206" r="16"/>
        <text class="small" x="246" y="246">隐藏层 2</text>
      </g>
      <g>
        <circle class="node" cx="398" cy="128" r="18"/>
        <text class="small" x="370" y="246">输出</text>
      </g>
      <g>
        <line class="edge" x1="36" y1="40" x2="132" y2="20"/>
        <line class="edge" x1="36" y1="40" x2="132" y2="82"/>
        <line class="edge" x1="36" y1="40" x2="132" y2="144"/>
        <line class="edge" x1="36" y1="118" x2="132" y2="20"/>
        <line class="edge" x1="36" y1="118" x2="132" y2="82"/>
        <line class="edge" x1="36" y1="118" x2="132" y2="144"/>
        <line class="edge" x1="36" y1="118" x2="132" y2="206"/>
        <line class="edge" x1="36" y1="196" x2="132" y2="82"/>
        <line class="edge" x1="36" y1="196" x2="132" y2="144"/>
        <line class="edge" x1="36" y1="196" x2="132" y2="206"/>
        <line class="edge" x1="164" y1="20" x2="260" y2="50"/>
        <line class="edge" x1="164" y1="82" x2="260" y2="50"/>
        <line class="edge" x1="164" y1="82" x2="260" y2="128"/>
        <line class="edge" x1="164" y1="144" x2="260" y2="128"/>
        <line class="edge" x1="164" y1="144" x2="260" y2="206"/>
        <line class="edge" x1="164" y1="206" x2="260" y2="206"/>
        <line class="edge" x1="292" y1="50" x2="380" y2="128"/>
        <line class="edge" x1="292" y1="128" x2="380" y2="128"/>
        <line class="edge" x1="292" y1="206" x2="380" y2="128"/>
      </g>
      <rect class="tag" x="86" y="282" width="118" height="34" rx="8"/>
      <text class="tagText" x="105" y="304">权重 + 偏置</text>
      <rect class="tag" x="220" y="282" width="104" height="34" rx="8"/>
      <text class="tagText" x="238" y="304">激活函数</text>
      <rect class="tag" x="340" y="282" width="96" height="34" rx="8"/>
      <text class="tagText" x="357" y="304">抽象表示</text>
    </g>
  </g>
  <text class="body" x="52" y="520">核心变化：线性模型只做一次加权求和；神经网络反复做“线性变换 + 非线性激活”，逐层形成更有用的表示。</text>
</svg>
