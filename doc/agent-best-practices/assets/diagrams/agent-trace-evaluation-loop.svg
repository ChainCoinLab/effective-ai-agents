<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent Trace 与评测闭环</title>
  <desc id="desc">展示 Agent 运行 trace 如何进入错误分类、评测样例、回归测试和线上监控。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #fff; stroke: #1f2937; stroke-width: 1.5; rx: 14; }
      .run { fill: #dbeafe; stroke: #1d4ed8; }
      .trace { fill: #f3e8ff; stroke: #7e22ce; }
      .eval { fill: #dcfce7; stroke: #166534; }
      .risk { fill: #fee2e2; stroke: #991b1b; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #0f766e; stroke-width: 2.4; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="48" y="58">Agent 可靠性来自 trace、失败分类、评测样例和回归测试</text>

  <rect class="box run" x="85" y="145" width="205" height="105"/>
  <text class="label" x="138" y="183">线上运行</text>
  <text class="small" x="117" y="213">用户任务、模型、工具</text>

  <rect class="box trace" x="360" y="145" width="205" height="105"/>
  <text class="label" x="421" y="183">Trace</text>
  <text class="small" x="392" y="213">prompt、tool、state、error</text>

  <rect class="box risk" x="635" y="145" width="205" height="105"/>
  <text class="label" x="688" y="183">失败分类</text>
  <text class="small" x="667" y="213">上下文、工具、权限、推理</text>

  <rect class="box eval" x="910" y="145" width="150" height="105"/>
  <text class="label" x="948" y="183">样例库</text>
  <text class="small" x="937" y="213">golden tasks</text>

  <rect class="box eval" x="635" y="365" width="205" height="105"/>
  <text class="label" x="688" y="403">回归评测</text>
  <text class="small" x="667" y="433">轨迹、结果、成本、安全</text>

  <rect class="box run" x="360" y="365" width="205" height="105"/>
  <text class="label" x="412" y="403">改进系统</text>
  <text class="small" x="392" y="433">prompt、tool schema、policy</text>

  <rect class="box" x="85" y="365" width="205" height="105"/>
  <text class="label" x="145" y="403">发布</text>
  <text class="small" x="117" y="433">灰度、监控、回滚</text>

  <path class="arrow" d="M290 197 H360"/>
  <path class="arrow" d="M565 197 H635"/>
  <path class="arrow" d="M840 197 H910"/>
  <path class="arrow" d="M985 250 C985 325 810 330 760 365"/>
  <path class="arrow" d="M635 417 H565"/>
  <path class="arrow" d="M360 417 H290"/>
  <path class="loop" d="M187 365 C130 300 120 250 187 250"/>

  <rect class="box" x="105" y="520" width="910" height="55"/>
  <text class="small" x="135" y="553">不要只评最终答案。工具调用顺序、证据来源、权限决策、失败恢复和成本延迟都必须进入评测。</text>
</svg>
