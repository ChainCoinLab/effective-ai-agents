<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">猫图识别中的特征和向量</title>
  <desc id="desc">图片从像素矩阵进入模型，逐步形成边缘、纹理、局部形状和高层特征，最后输出类别判断。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#53767b"/>
    </marker>
    <style>
      .bg { fill: #f8faf7; }
      .card { fill: #ffffff; stroke: #d7ded3; stroke-width: 2; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
      .head { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203040; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #465867; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6f78; }
      .arrow { stroke: #53767b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .pixel { fill: #eef4f1; stroke: #9bb8ad; stroke-width: 1; }
      .pixel2 { fill: #f6dca8; stroke: #d6a64d; stroke-width: 1; }
      .pixel3 { fill: #e7def5; stroke: #a99ad0; stroke-width: 1; }
      .line { stroke: #2f5d62; stroke-width: 4; fill: none; stroke-linecap: round; }
      .bar { fill: #8fb5aa; }
      .bar2 { fill: #f4c978; }
      .bar3 { fill: #a99ad0; }
      .cat { fill: #f4c978; stroke: #a76d18; stroke-width: 3; }
      .catLine { stroke: #6f4b1b; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="460"/>
  <text class="title" x="48" y="52">猫图识别：模型学的不是规则清单，而是特征表示</text>
  <g transform="translate(54 94)">
    <rect class="card" width="220" height="270" rx="16"/>
    <text class="head" x="24" y="42">像素矩阵</text>
    <g transform="translate(35 76)">
      <rect class="pixel" x="0" y="0" width="24" height="24"/>
      <rect class="pixel2" x="24" y="0" width="24" height="24"/>
      <rect class="pixel" x="48" y="0" width="24" height="24"/>
      <rect class="pixel3" x="72" y="0" width="24" height="24"/>
      <rect class="pixel" x="96" y="0" width="24" height="24"/>
      <rect class="pixel2" x="120" y="0" width="24" height="24"/>
      <rect class="pixel" x="144" y="0" width="24" height="24"/>
      <rect class="pixel2" x="0" y="24" width="24" height="24"/>
      <rect class="pixel" x="24" y="24" width="24" height="24"/>
      <rect class="pixel3" x="48" y="24" width="24" height="24"/>
      <rect class="pixel2" x="72" y="24" width="24" height="24"/>
      <rect class="pixel" x="96" y="24" width="24" height="24"/>
      <rect class="pixel" x="120" y="24" width="24" height="24"/>
      <rect class="pixel3" x="144" y="24" width="24" height="24"/>
      <rect class="pixel" x="0" y="48" width="24" height="24"/>
      <rect class="pixel2" x="24" y="48" width="24" height="24"/>
      <rect class="pixel" x="48" y="48" width="24" height="24"/>
      <rect class="pixel" x="72" y="48" width="24" height="24"/>
      <rect class="pixel2" x="96" y="48" width="24" height="24"/>
      <rect class="pixel3" x="120" y="48" width="24" height="24"/>
      <rect class="pixel" x="144" y="48" width="24" height="24"/>
      <rect class="pixel3" x="0" y="72" width="24" height="24"/>
      <rect class="pixel" x="24" y="72" width="24" height="24"/>
      <rect class="pixel2" x="48" y="72" width="24" height="24"/>
      <rect class="pixel" x="72" y="72" width="24" height="24"/>
      <rect class="pixel3" x="96" y="72" width="24" height="24"/>
      <rect class="pixel" x="120" y="72" width="24" height="24"/>
      <rect class="pixel2" x="144" y="72" width="24" height="24"/>
    </g>
    <text class="body" x="24" y="224">模型只能计算数字</text>
    <text class="small" x="24" y="250">图片先是大量 RGB 数值</text>
  </g>
  <path class="arrow" d="M290 229 H360"/>
  <g transform="translate(380 94)">
    <rect class="card" width="220" height="270" rx="16"/>
    <text class="head" x="24" y="42">低层特征</text>
    <path class="line" d="M48 98 H158"/>
    <path class="line" d="M58 142 L158 90"/>
    <path class="line" d="M58 178 C86 132, 132 132, 160 178"/>
    <text class="body" x="24" y="224">边缘、纹理、方向</text>
    <text class="small" x="24" y="250">不是手写规则，而是训练学到</text>
  </g>
  <path class="arrow" d="M616 229 H686"/>
  <g transform="translate(706 94)">
    <rect class="card" width="220" height="270" rx="16"/>
    <text class="head" x="24" y="42">高层组合</text>
    <path class="cat" d="M70 110 L88 72 L116 100 L144 72 L162 110 C176 160, 142 188, 116 188 C90 188, 56 160, 70 110 Z"/>
    <circle cx="98" cy="128" r="6" fill="#6f4b1b"/>
    <circle cx="136" cy="128" r="6" fill="#6f4b1b"/>
    <path class="catLine" d="M112 146 C116 150, 120 150, 124 146"/>
    <path class="catLine" d="M90 150 H60"/>
    <path class="catLine" d="M90 160 H62"/>
    <path class="catLine" d="M144 150 H174"/>
    <path class="catLine" d="M144 160 H172"/>
    <text class="body" x="24" y="224">眼睛、耳朵、脸部结构</text>
    <text class="small" x="24" y="250">多层网络逐步抽象</text>
  </g>
  <path class="arrow" d="M942 229 H1012"/>
  <g transform="translate(1022 94)">
    <rect class="card" width="130" height="270" rx="16"/>
    <text class="head" x="24" y="42">向量</text>
    <rect class="bar" x="32" y="82" width="70" height="14" rx="4"/>
    <rect class="bar2" x="32" y="112" width="46" height="14" rx="4"/>
    <rect class="bar3" x="32" y="142" width="82" height="14" rx="4"/>
    <rect class="bar" x="32" y="172" width="58" height="14" rx="4"/>
    <text class="body" x="26" y="224">类别：</text>
    <text class="head" x="26" y="252">猫</text>
  </g>
  <text class="body" x="54" y="420">连接到语言：文字也会先变成 token，再变成 embedding；模型真正处理的是向量空间里的表示。</text>
</svg>
