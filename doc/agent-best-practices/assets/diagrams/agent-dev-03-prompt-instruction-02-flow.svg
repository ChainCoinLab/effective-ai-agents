<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">03. Prompt 与指令工程 - 执行流程图</title>
  <desc id="desc">本节能力从输入到输出的控制流：把 Prompt 从一次性文本变成可版本化、可测试、可回滚的工程资产。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.7; }
      .ok { fill: #ecfeff; stroke: #0e7490; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .center { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">03. Prompt 与指令工程 - 执行流程图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">本节能力从输入到输出的控制流</text>
  <rect class="accent" x="55" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="73" y="218" text-anchor="start">目标</text>
  <text class="small" x="73" y="247" text-anchor="start">任务定义</text>
  <path class="arrow" d="M150 236 H190"/>
  <rect class="card" x="190" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="208" y="218" text-anchor="start">构造</text>
  <text class="small" x="208" y="247" text-anchor="start">角色边界</text>
  <path class="arrow" d="M285 236 H325"/>
  <rect class="accent" x="325" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="343" y="218" text-anchor="start">判断</text>
  <text class="small" x="343" y="247" text-anchor="start">指令层级</text>
  <path class="arrow" d="M420 236 H460"/>
  <rect class="card" x="460" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="478" y="218" text-anchor="start">执行</text>
  <text class="small" x="478" y="247" text-anchor="start">上下文隔离</text>
  <path class="arrow" d="M555 236 H595"/>
  <rect class="card" x="595" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="613" y="218" text-anchor="start">观察</text>
  <text class="small" x="613" y="247" text-anchor="start">示例选择</text>
  <path class="arrow" d="M690 236 H730"/>
  <rect class="card" x="730" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="748" y="218" text-anchor="start">更新</text>
  <text class="small" x="748" y="247" text-anchor="start">输出契约</text>
  <path class="arrow" d="M825 236 H865"/>
  <rect class="accent" x="865" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="883" y="218" text-anchor="start">验证</text>
  <text class="small" x="883" y="247" text-anchor="start">失败出口</text>
  <path class="arrow" d="M960 236 H1000"/>
  <rect class="card" x="1000" y="185" width="95" height="105" rx="14"/>
  <text class="label" x="1018" y="218" text-anchor="start">迭代</text>
  <text class="small" x="1018" y="247" text-anchor="start">Prompt 回归</text>
  <rect class="risk" x="120" y="390" width="260" height="105" rx="14"/>
  <text class="label" x="138" y="423" text-anchor="start">失败路径</text>
  <text class="small" x="138" y="452" text-anchor="start">规则混杂冲突，应对：分层管理指令</text>
  <rect class="ok" x="430" y="390" width="260" height="105" rx="14"/>
  <text class="label" x="448" y="423" text-anchor="start">恢复路径</text>
  <text class="small" x="448" y="452" text-anchor="start">外部上下文污染指令，应对：把外部材料标成 </text>
  <text class="small" x="448" y="472" text-anchor="start">data</text>
  <rect class="card" x="740" y="390" width="260" height="105" rx="14"/>
  <text class="label" x="758" y="423" text-anchor="start">完成路径</text>
  <text class="small" x="758" y="452" text-anchor="start">通过验证后输出，否则继续、澄清、暂停或转</text>
  <text class="small" x="758" y="472" text-anchor="start">人工</text>
</svg>
