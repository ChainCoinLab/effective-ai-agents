<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">10. 多 Agent 系统 - 责任边界图</title>
  <desc id="desc">多 Agent 系统：区分模型、应用层、工具层、状态层和人工确认各自负责什么。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #fdf2f8; stroke: #be185d; stroke-width: 1.7; }
      .ok { fill: #f8fafc; stroke: #111827; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .accentCircle { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #be185d; stroke-width: 2.3; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be185d"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">10. 多 Agent 系统 - 责任边界图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">区分模型、应用层、工具层、状态层和人工确认各自负责什么。</text>
  
  <rect class="accent" x="70" y="150" width="220" height="125" rx="14"/>
  <text class="label" x="88" y="184" text-anchor="start">模型负责</text>
  <text class="small" x="88" y="214" text-anchor="start">理解上下文、生成候选、解释信息、提出下</text>
  <text class="small" x="88" y="234" text-anchor="start">一步</text>
  <rect class="ok" x="330" y="150" width="220" height="125" rx="14"/>
  <text class="label" x="348" y="184" text-anchor="start">应用层负责</text>
  <text class="small" x="348" y="214" text-anchor="start">权限、状态、预算、路由、确认、审计</text>
  <rect class="card" x="590" y="150" width="220" height="125" rx="14"/>
  <text class="label" x="608" y="184" text-anchor="start">工具层负责</text>
  <text class="small" x="608" y="214" text-anchor="start">访问外部系统，返回结构化结果和错误码</text>
  <rect class="risk" x="850" y="150" width="220" height="125" rx="14"/>
  <text class="label" x="868" y="184" text-anchor="start">人工负责</text>
  <text class="small" x="868" y="214" text-anchor="start">高风险确认、异常复核、策略调整</text>
  <path class="arrow" d="M290 212 H330"/><path class="arrow" d="M550 212 H590"/><path class="arrow" d="M810 212 H850"/>
  <rect class="risk" x="100" y="355" width="260" height="112" rx="14"/>
  <text class="label" x="118" y="389" text-anchor="start">不能交给模型</text>
  <text class="small" x="118" y="419" text-anchor="start">共享完整上下文，解决方式：按角色最小化</text>
  <text class="small" x="118" y="439" text-anchor="start">上下文</text>
  <rect class="card" x="430" y="355" width="260" height="112" rx="14"/>
  <text class="label" x="448" y="389" text-anchor="start">本课边界</text>
  <text class="small" x="448" y="419" text-anchor="start">Multi-Agent = 职责拆分 </text>
  <text class="small" x="448" y="439" text-anchor="start">+ 上下文隔离 + 结构化 hando</text>
  <text class="small" x="448" y="459" text-anchor="start">ff + 协调控制 + 合并验证。</text>
  <rect class="ok" x="760" y="355" width="260" height="112" rx="14"/>
  <text class="label" x="778" y="389" text-anchor="start">工程原因</text>
  <text class="small" x="778" y="419" text-anchor="start">降低成本和泄露风险</text>
</svg>
