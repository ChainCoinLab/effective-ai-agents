<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Workflow 与 Agent 边界</title>
  <desc id="desc">展示确定性 workflow 承载关键路径，Agent 负责模糊判断、摘要、分类、生成和异常处理。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #fff; stroke: #334155; stroke-width: 1.5; rx: 16; }
      .wf { fill: #dbeafe; stroke: #1d4ed8; }
      .ag { fill: #f3e8ff; stroke: #7e22ce; }
      .risk { fill: #fee2e2; stroke: #991b1b; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="48" y="58">优先 Workflow，再在模糊节点引入 Agent</text>

  <rect class="lane" x="60" y="115" width="1000" height="175"/>
  <text class="label" x="90" y="153">确定性 Workflow：关键路径、状态迁移、权限、重试、幂等</text>
  <rect class="wf" x="100" y="190" width="145" height="58" rx="12"/>
  <text class="small" x="128" y="225">接收任务</text>
  <rect class="wf" x="305" y="190" width="145" height="58" rx="12"/>
  <text class="small" x="332" y="225">读取状态</text>
  <rect class="wf" x="510" y="190" width="145" height="58" rx="12"/>
  <text class="small" x="537" y="225">执行步骤</text>
  <rect class="wf" x="715" y="190" width="145" height="58" rx="12"/>
  <text class="small" x="742" y="225">写入状态</text>
  <rect class="wf" x="920" y="190" width="100" height="58" rx="12"/>
  <text class="small" x="946" y="225">完成</text>
  <path class="arrow" d="M245 219 H305"/>
  <path class="arrow" d="M450 219 H510"/>
  <path class="arrow" d="M655 219 H715"/>
  <path class="arrow" d="M860 219 H920"/>

  <rect class="lane" x="60" y="350" width="1000" height="185"/>
  <text class="label" x="90" y="388">Agent 适合放在模糊判断节点：理解、分类、摘要、生成、异常处理</text>
  <rect class="ag" x="120" y="430" width="190" height="65" rx="12"/>
  <text class="small" x="150" y="458">判断下一步</text>
  <text class="tiny" x="150" y="480">需要证据和停止条件</text>
  <rect class="ag" x="365" y="430" width="190" height="65" rx="12"/>
  <text class="small" x="395" y="458">整理工具结果</text>
  <text class="tiny" x="395" y="480">不得编造来源</text>
  <rect class="ag" x="610" y="430" width="190" height="65" rx="12"/>
  <text class="small" x="640" y="458">生成用户输出</text>
  <text class="tiny" x="640" y="480">结构化和可验证</text>
  <rect class="risk" x="855" y="430" width="145" height="65" rx="12"/>
  <text class="small" x="883" y="458">异常升级</text>
  <text class="tiny" x="883" y="480">转人工或暂停</text>
  <path class="arrow" d="M310 462 H365"/>
  <path class="arrow" d="M555 462 H610"/>
  <path class="arrow" d="M800 462 H855"/>

  <path class="arrow" d="M582 248 C575 300 470 355 460 430"/>
  <path class="arrow" d="M705 430 C700 340 585 300 582 248"/>
</svg>
