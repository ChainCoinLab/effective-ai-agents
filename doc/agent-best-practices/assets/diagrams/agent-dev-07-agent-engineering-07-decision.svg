<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">07. Agent 工程化 - 决策分支图</title>
  <desc id="desc">继续、停止、澄清、工具、转人工的判断：把 Agent 从演示变成可控、可观测、可恢复、可评估、可部署的工程系统。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.7; }
      .ok { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .center { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">07. Agent 工程化 - 决策分支图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">继续、停止、澄清、工具、转人工的判断</text>
  
  <rect class="ok" x="80" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="98" y="178" text-anchor="start">继续</text>
  <text class="small" x="98" y="207" text-anchor="start">证据充分、预算未超、下一步明确</text>
  <rect class="card" x="330" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="348" y="178" text-anchor="start">澄清</text>
  <text class="small" x="348" y="207" text-anchor="start">目标、参数、权限或证据缺失</text>
  <rect class="accent" x="580" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="598" y="178" text-anchor="start">调用能力</text>
  <text class="small" x="598" y="207" text-anchor="start">工具、RAG、Skill、Workflo</text>
  <text class="small" x="598" y="227" text-anchor="start">w 或子 Agent</text>
  <rect class="risk" x="830" y="145" width="210" height="100" rx="14"/>
  <text class="label" x="848" y="178" text-anchor="start">停止</text>
  <text class="small" x="848" y="207" text-anchor="start">完成、失败、超预算、等待确认</text>
  <path class="arrow" d="M290 195 H330"/><path class="arrow" d="M540 195 H580"/><path class="arrow" d="M790 195 H830"/>
  <rect class="card" x="130" y="365" width="260" height="105" rx="14"/>
  <text class="label" x="148" y="398" text-anchor="start">决策依据</text>
  <text class="small" x="148" y="427" text-anchor="start">成功标准、当前状态、证据质量、风险等级和</text>
  <text class="small" x="148" y="447" text-anchor="start">预算</text>
  <rect class="risk" x="430" y="365" width="260" height="105" rx="14"/>
  <text class="label" x="448" y="398" text-anchor="start">错误处理</text>
  <text class="small" x="448" y="427" text-anchor="start">上线后无法定位失败；trace/span </text>
  <text class="small" x="448" y="447" text-anchor="start">和失败分类</text>
  <rect class="ok" x="730" y="365" width="260" height="105" rx="14"/>
  <text class="label" x="748" y="398" text-anchor="start">记录要求</text>
  <text class="small" x="748" y="427" text-anchor="start">每个分支都要有 reason、input、</text>
  <text class="small" x="748" y="447" text-anchor="start">output 和 stop reason</text>
</svg>
