<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">08. 测评与反馈闭环 - 验证评估图</title>
  <desc id="desc">如何把本节变成可测试样例：用测试、评估、验证和失败分类衡量 Agent 质量，覆盖最终答案和中间过程。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .accent { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.7; }
      .ok { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.7; }
      .risk { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.7; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .center { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .centerTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .centerSmall { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1120" height="640"/>
  <text class="title" x="52" y="55">08. 测评与反馈闭环 - 验证评估图</text>
  <text class="subtitle" x="54" y="86" text-anchor="start">如何把本节变成可测试样例</text>
  
  <rect class="accent" x="75" y="145" width="220" height="105" rx="14"/>
  <text class="label" x="93" y="178" text-anchor="start">样例集</text>
  <text class="small" x="93" y="207" text-anchor="start">正常、边界、失败、攻击、低质量输入</text>
  <rect class="card" x="330" y="145" width="220" height="105" rx="14"/>
  <text class="label" x="348" y="178" text-anchor="start">过程断言</text>
  <text class="small" x="348" y="207" text-anchor="start">决策、工具、参数、状态、证据、权限</text>
  <rect class="card" x="585" y="145" width="220" height="105" rx="14"/>
  <text class="label" x="603" y="178" text-anchor="start">结果断言</text>
  <text class="small" x="603" y="207" text-anchor="start">格式、事实、引用、安全和用户可用性</text>
  <rect class="ok" x="840" y="145" width="220" height="105" rx="14"/>
  <text class="label" x="858" y="178" text-anchor="start">回归门禁</text>
  <text class="small" x="858" y="207" text-anchor="start">prompt、模型、工具、知识库变更都触</text>
  <text class="small" x="858" y="227" text-anchor="start">发</text>
  <path class="arrow" d="M295 197 H330"/><path class="arrow" d="M550 197 H585"/><path class="arrow" d="M805 197 H840"/>
  <rect class="ok" x="150" y="365" width="250" height="105" rx="14"/>
  <text class="label" x="168" y="398" text-anchor="start">核心指标</text>
  <text class="small" x="168" y="427" text-anchor="start">任务完成率、失败率、成本、延迟、安全拦截</text>
  <rect class="card" x="455" y="365" width="250" height="105" rx="14"/>
  <text class="label" x="473" y="398" text-anchor="start">质量证据</text>
  <text class="small" x="473" y="427" text-anchor="start">trace、状态快照、工具结果、veri</text>
  <text class="small" x="473" y="447" text-anchor="start">fier 结果</text>
  <rect class="accent" x="760" y="365" width="250" height="105" rx="14"/>
  <text class="label" x="778" y="398" text-anchor="start">改进闭环</text>
  <text class="small" x="778" y="427" text-anchor="start">失败样例进入下一轮评估和修复</text>
</svg>
