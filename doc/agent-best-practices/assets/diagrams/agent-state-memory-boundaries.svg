<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">状态、记忆和上下文边界</title>
  <desc id="desc">区分上下文、任务状态、业务状态、长期记忆和日志 trace。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #fff; stroke: #1f2937; stroke-width: 1.5; rx: 14; }
      .ctx { fill: #dbeafe; stroke: #1d4ed8; }
      .task { fill: #fef3c7; stroke: #92400e; }
      .biz { fill: #dcfce7; stroke: #166534; }
      .mem { fill: #f3e8ff; stroke: #7e22ce; }
      .trace { fill: #fee2e2; stroke: #991b1b; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="48" y="58">不要把上下文、状态、记忆、业务数据和日志混成一段聊天记录</text>

  <rect class="box ctx" x="75" y="140" width="230" height="140"/>
  <text class="label" x="125" y="176">Context</text>
  <text class="small" x="105" y="210">本轮给模型看的输入</text>
  <text class="tiny" x="105" y="238">短期、可裁剪、受 token 限制</text>

  <rect class="box task" x="445" y="115" width="230" height="140"/>
  <text class="label" x="495" y="151">Task State</text>
  <text class="small" x="475" y="185">任务进度和恢复点</text>
  <text class="tiny" x="475" y="213">结构化、可查询、可恢复</text>

  <rect class="box biz" x="815" y="140" width="230" height="140"/>
  <text class="label" x="872" y="176">Business State</text>
  <text class="small" x="845" y="210">订单、账户、权限等真实业务状态</text>
  <text class="tiny" x="845" y="238">强一致、受权限和事务保护</text>

  <rect class="box mem" x="250" y="390" width="230" height="140"/>
  <text class="label" x="318" y="426">Memory</text>
  <text class="small" x="280" y="460">长期偏好和稳定事实</text>
  <text class="tiny" x="280" y="488">有来源、时间、删除和更新策略</text>

  <rect class="box trace" x="640" y="390" width="230" height="140"/>
  <text class="label" x="705" y="426">Trace</text>
  <text class="small" x="670" y="460">过程审计和问题定位</text>
  <text class="tiny" x="670" y="488">prompt、tool call、result、error</text>

  <path class="arrow" d="M445 185 H305"/>
  <path class="arrow" d="M675 185 H815"/>
  <path class="arrow" d="M365 390 C350 330 260 300 190 280"/>
  <path class="arrow" d="M755 390 C690 330 640 285 610 255"/>
  <path class="dash" d="M560 255 V345"/>
  <text class="tiny" x="578" y="318">状态可摘要进上下文</text>
  <text class="tiny" x="525" y="365">但上下文不是状态库</text>
</svg>
